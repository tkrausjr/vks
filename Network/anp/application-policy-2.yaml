apiVersion: crd.antrea.io/v1beta1
kind: NetworkPolicy
metadata:
  name: allow-client-to-service
spec:
  priority: 100
  appliedTo:
    - podSelector:
        matchLabels:
          app-name: music-store
  egress:
    - action: Allow
      name: AllowToClusterIPServicepostgres
      toServices:
        - name: postgres-service       # Name of the ClusterIP Service
          namespace: default  # Namespace where the Service is located
    - action: Allow
      name: AllowToClusterIPServiceorder
      toServices:
        - name: order-service       # Name of the ClusterIP Service
          namespace: default  # Namespace where the Service is located
    - action: Allow
      name: AllowToClusterIPServicechat
      toServices:
        - name: chat-service       # Name of the ClusterIP Service
          namespace: default  # Namespace where the Service is located
    - action: Allow
      name: AllowToClusterIPServicecart
      toServices:
        - name: cart-service       # Name of the ClusterIP Service
          namespace: default  # Namespace where the Service is located
    - action: Allow
      name: AllowToClusterIPServiceusers
      toServices:
        - name: users-service       # Name of the ClusterIP Service
          namespace: default  # Namespace where the Service is located
---
# 1. Chat Service Policy[cite: 1]
apiVersion: crd.antrea.io/v1beta1
kind: NetworkPolicy
metadata:
  name: chat-service-policy
spec:
  tier: Application
  priority: 100
  appliedTo:
  - podSelector:
      matchLabels:
        app: chat-service
  ingress:
  - action: Allow
    from:
    - podSelector:
        matchLabels:
          app: music-store-1
    ports:
    - protocol: TCP
      port: 5005
  egress:
  - action: Allow
    to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - action: Allow
    to:
    - podSelector:
        matchLabels:
          app: order-service
    ports:
    - protocol: TCP
      port: 5001
  - action: Allow # Allow external API access for the Private AI / Qwen endpoint[cite: 1]
    to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
  - action: Allow # DNS Resolution
    to:
    - podSelector: {}
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

---
# 2. Users Service Policy[cite: 2]
apiVersion: crd.antrea.io/v1beta1
kind: NetworkPolicy
metadata:
  name: users-service-policy
spec:
  tier: Application
  priority: 101
  appliedTo:
  - podSelector:
      matchLabels:
        app: users-service
  ingress:
  - action: Allow
    from:
    - podSelector:
        matchLabels:
          app: music-store-1
    - podSelector:
        matchLabels:
          app: traffic-generator
    ports:
    - protocol: TCP
      port: 5003
  egress:
  - action: Allow # DNS Resolution
    to:
    - podSelector: {}
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

