        matchLabels:
          app: cart-service
    ports:
    - protocol: TCP
      port: 5002
  - action: Allow
    to:
    - podSelector:
        matchLabels:
          app: order-service
    ports:
    - protocol: TCP
      port: 5001
  - action: Allow
    to:
    - podSelector:
        matchLabels:
          app: users-service
    ports:
    - protocol: TCP
      port: 5003
  - action: Allow # DNS Resolution
    to:
    - podSelector: {}
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
