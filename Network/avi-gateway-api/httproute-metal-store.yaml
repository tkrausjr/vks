apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: metal-store-frontend
  namespace: music-store
spec:
  parentRefs:
  - name: metal-store
    namespace: default
  hostnames:
  - "metal-store.acme.gpu.set.lab"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: music-store-1-service
      port: 5000
