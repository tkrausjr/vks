apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentbit-config-custom
  namespace: vmware-system-logging
data:
  filters-custom.conf: |
    [FILTER]
        Name              record_modifier
        Alias             audit_apiserver_modifier
        Match             audit.apiserver.*
        Record            hostname ${NODE_NAME}
  inputs-custom.conf: |
    [INPUT]
        Name              tail
        Tag               audit.apiserver.*
        Path              /var/log/vmware/audit/kube-apiserver.log
        DB                /var/log/vmware/fluentbit/flb_audit_apiserver.db
        Buffer_Chunk_Size 1MB
        Buffer_Max_Size   12MB
        Skip_Long_Lines   Off
        Refresh_Interval  10
  outputs-custom.conf: |
    [OUTPUT]
        Name                syslog
        Alias               syslog_audit_apiserver
        Match               audit.apiserver.*
        Host                10.47.7.49
        Port                1514
        Mode                tcp
        Syslog_Format       rfc5424
        Syslog_Message_key  log
        Syslog_Hostname_key hostname
  parsers-custom.conf: ''