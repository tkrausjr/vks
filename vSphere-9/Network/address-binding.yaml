## This object is for accessing a VM or POD inside 
## a VPC with IP Address from the External IP Space
apiVersion: crd.nsx.vmware.com/v1alpha1
kind: AddressBinding
metadata:
  name: vks-01-workernode-cb5dq # arbitrary name for binding instance
  namespace: test-ns01 # vSphere namespace where cluster & vms are located
spec:
  interfaceName: eth0 # For Ubuntu based VKR
  vmName: vks-01-nfs-datastore-policy-mgg7k-8zxrc-cb5dq # kubectl get vm in the vSphere namespace
