apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-server-vmdk-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-server-vmdk-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-server-vmdk-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: default # Replace with your VKS vSphere StorageClass name
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfs-server-test
  template:
    metadata:
      labels:
        app: nfs-server-test
    spec:
      containers:
      - name: nfs-server
        image: itsthenetwork/nfs-server-alpine:latest
        ports:
        - name: nfs
          containerPort: 2049
        - name: mountd
          containerPort: 20048
        - name: rpcbind
          containerPort: 111
        securityContext:
          privileged: true # Required to run NFS kernel server modules
        env:
        - name: SHARED_DIRECTORY
          value: /nfsshare
        volumeMounts:
        - name: nfs-storage
          mountPath: /nfsshare
      volumes:
      - name: nfs-storage
        persistentVolumeClaim:
          claimName: nfs-server-vmdk-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server-test-service
spec:
  ports:
  - name: nfs
    port: 2049
  - name: mountd
    port: 20048
  - name: rpcbind
    port: 111
  selector:
    app: nfs-server-test # Replace with your VKS vSphere StorageClass name
  resources:
    requests:
      storage: 10Gi
---
